name: Repository check

on:
  push:
  pull_request:

jobs:
  check:
    name: Documents, canon and PowerShell proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check status headers, links, canon agreement and proofs
        shell: pwsh
        run: ./Scripts/Test-Repository.ps1

  authority:
    name: Canon authority of the new commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every canon commit says on whose authority
        shell: pwsh
        env:
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if ($env:PULL_BASE) { $range = "$($env:PULL_BASE)..HEAD" }
          elseif ($env:PUSH_BEFORE -and $env:PUSH_BEFORE -notmatch '^0+$') { $range = "$($env:PUSH_BEFORE)..HEAD" }
          else { $range = 'HEAD~1..HEAD' }
          # Judge the range with the check as it stood before it, so a commit
          # in the range cannot weaken its own judge.
          $base = ($range -split '\.\.')[0]
          $check = './Scripts/Test-CanonAuthority.ps1'
          git cat-file -e "${base}:Scripts/Test-CanonAuthority.ps1" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $check = Join-Path $env:RUNNER_TEMP 'Test-CanonAuthority.ps1'
            git show "${base}:Scripts/Test-CanonAuthority.ps1" | Set-Content $check
          }
          & $check -Range $range -Repository $PWD

  reference:
    name: Reference system (.NET) and its conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and prove Reference/Billing
        run: dotnet test Reference/Billing/Billing.sln --configuration Release
